[package]
name = "ambien"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[[bin]]
name = "ambien"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", default-features = false, features = ["stacker"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", default-features = false, features = ["font-kit"] }
ely = { package = "ely-gpui-component", git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components", rev = "78bf5917a5a5634ef16b42bc0637b2bce911728d", default-features = false, features = ["runtime_shaders"] }
fundsp = { version = "=0.23.0", default-features = false, features = ["std"] }
cpal = { version = "=0.18.2", default-features = false }
async-channel = "=2.5.0"
parking_lot = "=0.12.5"
serde_json = "=1.0.151"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
raw-window-handle = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSButton", "NSControl", "NSGraphics", "NSResponder", "NSScreen", "NSView", "NSWindow", "NSWorkspace", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSString", "NSValue", "block2", "objc2-core-foundation"] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware", "block2", "dispatch2"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
